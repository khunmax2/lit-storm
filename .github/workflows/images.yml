name: Images

# Builds the two images host 203 runs and pushes them to GHCR, so a deploy
# pulls digests instead of building on the host (docs/deploy/HOST-203.md).
#
# On a deploy tag, or by hand for any ref:
#   git tag -a deploy-YYYY-MM-DD -m "..." && git push origin deploy-YYYY-MM-DD
#   gh workflow run images.yml --repo khunmax2/lit-storm --ref <tag>
#
# The Engine forks are checked out at the commits in stack/engines.lock.json,
# and stack/build-images.sh (the one place the build arguments live) refuses
# anything else. The job summary prints the digests to put in the host's
# stack/host.env.
#
# Images: ghcr.io/khunmax2/lit-storm-server, ghcr.io/khunmax2/lit-storm-web
# (built for /litstorm). Platform: linux/amd64, the host's.

on:
  push:
    tags: ["deploy-*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # The server image is about 7 GB (torch, Chromium, Node); a runner
      # starts with some 14 GB free. Drop the toolchains it does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - name: Checkout lit-storm
        uses: actions/checkout@v4
        with:
          path: lit-storm

      - name: Read the Engine pins
        id: pin
        shell: python
        run: |
          import json, os
          lock = json.load(open("lit-storm/stack/engines.lock.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for name in ("agents", "deep"):
                  out.write(f"{name}_repo={lock[name]['repo']}\n{name}_commit={lock[name]['commit']}\n")

      # Beside lit-storm, where stack/compose.yml and the server's
      # pyproject.toml look for them.
      - name: Checkout Agent Research at its pin
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.agents_repo }}
          ref: ${{ steps.pin.outputs.agents_commit }}
          path: agents-deep-research

      - name: Checkout Deep Research at its pin
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.deep_repo }}
          ref: ${{ steps.pin.outputs.deep_commit }}
          path: deep-research-web-ui

      - name: Tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build with stack/build-images.sh
        run: bash lit-storm/stack/build-images.sh "${{ steps.tag.outputs.tag }}" agents-deep-research deep-research-web-ui

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and record the digests
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          {
            echo "## lit-storm images ($tag)"
            echo
            echo "lit-storm \`$(git -C lit-storm rev-parse HEAD)\`, agents \`${{ steps.pin.outputs.agents_commit }}\`, deep \`${{ steps.pin.outputs.deep_commit }}\`"
            echo
            echo "Put in the host's \`stack/host.env\`:"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for image in server web; do
            ref="ghcr.io/khunmax2/lit-storm-$image:$tag"
            docker push "$ref"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")
            var=$([ "$image" = server ] && echo LITSTORM_SERVER_IMAGE || echo LITSTORM_WEB_IMAGE)
            echo "$var=$digest" >> "$GITHUB_STEP_SUMMARY"
            echo "$var=$digest"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
