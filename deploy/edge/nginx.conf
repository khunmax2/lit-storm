# The one door into the stack.
#
# Everything else stops publishing a port, so the stack asks the host for
# exactly one thing. That is what makes two stacks able to share a machine:
# the host's ports are a single namespace, and a stack that claims six of
# them collides with anything that wants one of those six. Starting this
# beside another project here failed on 8080 for precisely that reason.
#
# It also means the laptop is shaped like a host, so `/research/` working
# locally is evidence that it will work deployed, rather than a thing to
# find out later.

# Streamlit talks over a WebSocket, and nginx only upgrades a connection
# when it is asked to. Without this the app loads and then sits there: the
# page is served over HTTP, and the socket that carries every rerun fails.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Reports run to megabytes and Streamlit posts file uploads through here.
    client_max_body_size 64m;

    # A research can be minutes long and answers in one response. nginx's
    # default 60s read timeout would cut the connection while the model is
    # still writing, and the browser would see a 504 from a run that was
    # working.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- the siblings, each under a path ---------------------------------
    # The trailing slash on proxy_pass strips the prefix, so each sibling
    # keeps serving from its own root and needs to know nothing about where
    # it is mounted. The one thing that does have to know is the page's own
    # links, which is why the agents page fetches "api/runs" and not
    # "/api/runs".

    # Without these redirects a browser asking for /research gets the page
    # but resolves its relative links against /, one level too high.
    location = /research { return 301 /research/; }
    location = /agents   { return 301 /agents/; }

    # No trailing slash, so the prefix is NOT stripped. Nuxt is told it
    # lives at /research/ (NUXT_APP_BASE_URL) and serves there; stripping
    # would hand it "/" and it answers 500, because its pages and its asset
    # URLs are all built under the base path.
    location /research/ {
        proxy_pass http://research-ui:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /agents/ {
        proxy_pass http://agents-research:3000/;
        proxy_http_version 1.1;
    }

    # --- the app, at the root --------------------------------------------
    # At the root rather than a path because Streamlit needs
    # --server.baseUrlPath to live anywhere else, and the app is the thing
    # someone types the address for. The siblings are only ever reached
    # through it.
    location / {
        proxy_pass http://app:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Streamlit's own reconnect handles a dropped socket; buffering the
        # stream here would delay every rerun by nginx's buffer, not by the
        # app's own speed.
        proxy_buffering off;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
