# The two paths supabase-py builds from SUPABASE_URL, routed to the two
# services that answer them. Kong does this in the full stack; there is
# nothing here it would add that this app uses.
#
# The trailing slash on each proxy_pass is what strips the prefix: GoTrue and
# PostgREST both serve from their own root and know nothing about /auth/v1 or
# /rest/v1.

server {
    listen 8000;
    server_name _;

    # A key is a JWT; a refresh token round-trips. Neither is large, but an
    # article's citation payload can be, so do not cap it at nginx's default.
    client_max_body_size 16m;

    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PostgREST reads the role from the JWT. supabase-py sends the key as
        # `apikey` and the session token as `Authorization`; only the latter
        # matters here, and it is passed through untouched.
        proxy_set_header Authorization $http_authorization;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
