[client]
showErrorDetails = false
# "viewer" keeps the settings menu reachable, which is where the
# light/dark/system appearance switch lives.
toolbarMode = "viewer"

[theme]
font = "sans serif"
baseRadius = "0.6rem"
buttonRadius = "0.55rem"

# Keep these in sync with LIGHT / DARK in ui_theme.py.
[theme.light]
primaryColor = "#1D4ED8"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"
linkColor = "#1D4ED8"

[theme.dark]
primaryColor = "#60A5FA"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131E31"
textColor = "#E2E8F0"
borderColor = "#1E293B"
linkColor = "#60A5FA"
