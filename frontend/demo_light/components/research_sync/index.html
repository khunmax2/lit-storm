<!doctype html>
<meta charset="utf-8" />
<title>research sync</title>
<!--
  Watches the Deep Research application's own history and hands finished
  reports to Python, which files them in the library.

  This works because of one fact about the deployment: the app and the
  research UI are served by the same proxy, on the same host and port, so
  the browser gives them the same origin — and therefore the same
  localStorage. The research UI writes its finished runs there, report text
  and all. Nothing has to be added to it, and nothing has to know who is
  signed in: the saving happens in Python, which already does.

  Streamlit's component iframes are sandboxed `allow-same-origin
  allow-scripts allow-downloads`. The first of those is what makes the read
  below legal; without it the accessor throws, which is why it is wrapped.

  The protocol is Streamlit's own, spoken by hand rather than through
  streamlit-component-lib, so this ships as two static files with no build
  step. The four message types used here are all present in the Streamlit
  bundle this is served by; `check_research_ui_contract.py` guards the other
  half of the bargain, which is the shape of the history itself.
-->
<style>
  /* Nothing to show. The component exists to read and report. */
  html, body { margin: 0; padding: 0; height: 0; overflow: hidden; }
</style>
<script>
  "use strict";

  // Where the research UI keeps its runs. Asserted against the pinned image
  // by deploy/research-ui/check_research_ui_contract.py, so an upstream bump
  // that renames it fails the check instead of quietly syncing nothing.
  var HISTORY_KEY = "deep-research-history";

  // Slow on purpose. A run takes minutes; nothing is gained by looking more
  // often than a person would, and every push costs a Streamlit rerun.
  var LOOK_EVERY_MS = 5000;

  var saved = [];          // run ids Python says are already in the library
  var announced = null;    // the last id handed over, so it goes over once

  function send(type, extra) {
    var message = { isStreamlitMessage: true, type: type };
    for (var key in extra) message[key] = extra[key];
    window.parent.postMessage(message, "*");
  }

  function history() {
    // Any of this can fail: storage disabled, a half-written value, a shape
    // that changed. A sync that cannot read is a sync that does nothing,
    // never a page that breaks.
    try {
      var raw = window.localStorage.getItem(HISTORY_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      var items = parsed && parsed.items;
      return Array.isArray(items) ? items : [];
    } catch (error) {
      return [];
    }
  }

  function finished(item) {
    // A run counts as finished when it has a report. The history also holds
    // runs that were abandoned partway, and those are not articles.
    return (
      item &&
      typeof item.id === "string" &&
      typeof item.report === "string" &&
      item.report.trim().length > 0
    );
  }

  function look() {
    var items = history();
    // Newest first, so a backlog arrives in the order a person would expect
    // to find it — and one per pass, because each one costs a rerun.
    items.sort(function (a, b) {
      return (b.updatedAt || b.createdAt || 0) > (a.updatedAt || a.createdAt || 0) ? 1 : -1;
    });
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      if (!finished(item)) continue;
      if (saved.indexOf(item.id) !== -1) continue;
      if (announced === item.id) return; // handed over; waiting for Python
      announced = item.id;
      send("streamlit:setComponentValue", {
        dataType: "json",
        value: {
          id: item.id,
          title: typeof item.title === "string" ? item.title : "",
          query: typeof item.query === "string" ? item.query : "",
          report: item.report,
          createdAt: item.createdAt || "",
        },
      });
      return;
    }
  }

  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") return;
    var args = event.data.args || {};
    saved = Array.isArray(args.saved) ? args.saved : [];
    // Python has caught up with what was handed over, so the next one may
    // go. Without this a second report in the same session would sit behind
    // the first forever.
    if (announced !== null && saved.indexOf(announced) !== -1) announced = null;
    look();
  });

  send("streamlit:setFrameHeight", { height: 0 });
  send("streamlit:componentReady", { apiVersion: 1 });
  setInterval(look, LOOK_EVERY_MS);
</script>
