[project]
name = "litstorm-server"
version = "0.1.0"
description = "API and Worker for the lit-storm web app"
requires-python = ">=3.11,<3.13"
dependencies = [
    "knowledge-storm",
    "markdown-it-py>=3",
    "requests>=2.31",
    "fastapi>=0.115",
    "email-validator>=2.1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=43",
]

[project.optional-dependencies]
# Chromium prints the PDF export. Kept optional so the API image can do
# without a browser; the Worker installs it.
pdf = ["playwright>=1.47"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "testcontainers[postgres]>=4.8"]

[project.scripts]
litstorm = "litstorm.cli:main"

[tool.uv.sources]
knowledge-storm = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litstorm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real LLM or search service and costs money",
    "slow: starts processes that import STORM",
    "db: needs Docker for a throwaway Postgres",
]
pythonpath = ["tests"]
addopts = "-m 'not live'"
