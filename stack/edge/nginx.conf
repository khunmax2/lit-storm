# Stands in for host 203's nginx (docs/web-app-design.md, รุ่นสอง: การติดตั้ง):
# DeepWitya owns the root there, lit-storm lives under /litstorm/. The path is
# passed on as it is; the web container serves under it. On the host this
# block goes in the existing server, with TLS, and proxy_pass points at the
# port the stack publishes there (127.0.0.1:10340).
server {
    listen 80;
    server_name _;
    absolute_redirect off;

    location = /litstorm { return 301 /litstorm/; }

    location /litstorm/ {
        proxy_pass http://web:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    # DeepWitya's place on the host.
    location / {
        default_type text/plain;
        return 404 "not lit-storm: it lives under /litstorm/\n";
    }
}
