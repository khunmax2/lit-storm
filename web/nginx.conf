# The Dockerfile fills in the base path the image was built for wherever
# the locations below start with it: nothing at the root, "/litstorm"
# behind host 203's nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Redirects name no host or port: behind a proxy those would be ours.
    absolute_redirect off;
    # Look "api" up again as it changes (a recreated api container gets a new
    # address; a name in proxy_pass is resolved only at start).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # The base path without its slash (dropped when serving at the root).
    location = __BASE__ { return 301 __BASE__/; }

    # Report exports and PDFs can take a while to print. The API knows
    # nothing of the base path: it is taken off here.
    location __BASE__/api/ {
        rewrite ^__BASE__/api/(.*)$ /api/$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
        # A Run's live stream asks not to be buffered (X-Accel-Buffering: no).
        # nginx acts on that and drops the header; pass it on, so a proxy in
        # front (stack/edge, the host's nginx) does the same.
        proxy_pass_header X-Accel-Buffering;
    }

    # Built assets carry a content hash in their names; keep them forever.
    location __BASE__/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is a page of the single-page app.
    location __BASE__/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
        try_files $uri __BASE__/index.html;
    }
}
